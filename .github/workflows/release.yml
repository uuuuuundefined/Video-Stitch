name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: version
        name: Check matching package versions
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          package = json.loads(Path('package.json').read_text())['version']
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          cargo = tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version']
          if package != tauri or package != cargo or not re.fullmatch(r'\d+\.\d+\.\d+', package):
              raise SystemExit('Package, Tauri and Cargo versions must match a stable x.y.z version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{package}\n')
          PY

  windows:
    needs: version
    uses: ./.github/workflows/windows-build.yml

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Install frontend dependencies
        run: npm ci
      - name: Check source and core tests
        run: |
          npm run format:check
          npm run rust -- fmt --manifest-path src-tauri/Cargo.toml -- --check
          npm run test:media-components
          npm run test:core
      - name: Build pinned media components
        run: |
          npm run media:sources
          npm run media:build:mac
      - name: Check desktop code and real media
        run: |
          npm run rust -- clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          npm run test:media
      - name: Build macOS disk image
        run: npm run desktop:build -- --bundles dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-stitch-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: video-stitch-*
          merge-multiple: true
          path: release-assets
      - name: Verify both installers and generate SHA-256
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*-setup.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish complete release
        run: node scripts/publish-release.mjs
