name: Windows installed application diagnosis

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-compatibility]
    paths:
      - ".github/workflows/windows-installer-check.yml"
      - ".github/windows-installer-probe.ps1"

permissions:
  contents: read
  actions: read

jobs:
  installed-app:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: video-stitch-windows-x64
          run-id: 39235874986
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: installer
      - run: ./.github/windows-installer-probe.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-startup-diagnostics
          path: diagnostics/*
          retention-days: 3
