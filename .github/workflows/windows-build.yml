name: Windows build and media checks

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-compatibility]
    paths:
      - ".github/workflows/windows-build.yml"
      - "scripts/**"
      - "src-tauri/**"
      - "src/**"
      - "package*.json"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify component validation tests
        run: npm run test:media-components
      - name: Run Windows core tests
        run: npm run test:core
      - name: Fetch pinned media sources
        run: npm run media:sources
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            make tar xz
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
      - name: Build static media components
        shell: msys2 {0}
        run: sh scripts/build-ffmpeg-windows.sh
      - name: Run Windows media regression tests
        run: npm run test:media
      - name: Check Windows desktop code
        run: npm run rust -- clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build offline NSIS installer
        run: npm run desktop:build -- --bundles nsis
      - name: Verify NSIS install and uninstall data boundaries
        run: ./scripts/smoke-windows-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: video-stitch-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
